on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

name: Pull Request updated

permissions: {}

jobs:
  triage:
    name: Pull Request Labeler
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    if: "! startsWith(github.head_ref, 'release/')"
    steps:
      - uses: actions/labeler@ac9175f8a1f3625fd0d4fb234536d26811351594 # v4.3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  history:
    name: Pull Request Body
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    if: github.event.pull_request.head.user.id == github.event.pull_request.base.user.id
    steps:
      - uses: technote-space/load-config-action@dbd17f7e0b2b95e36eb25d01e416baf85d7fa991 # v1.6.4
        with:
          CONFIG_FILENAME: workflow-settings.json, workflow-details.json
          IGNORE_WARNING: 'true'
      - uses: technote-space/pr-commit-body-action@e99c2e3ddf9b1295db429b9392fb759731c4c9b1 # v1.7.3
        with:
          EXCLUDE_MESSAGES: ${{ env.EXCLUDE_MESSAGES }}
          TITLE: ${{ env.PR_BODY_TITLE }}
          LINK_ISSUE_KEYWORD: ${{ (startsWith(github.head_ref, 'release/') && 'closes') || '' }}
          FILTER_PR: true
          CHANGE_TEMPLATE: ${{ env.CHANGE_TEMPLATE }}

  manageRelease:
    name: Manage release
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    if: "github.event.pull_request.head.user.id == github.event.pull_request.base.user.id && startsWith(github.head_ref, 'release/') && ! startsWith(github.head_ref, 'release/v')"
    steps:
      - uses: technote-space/load-config-action@dbd17f7e0b2b95e36eb25d01e416baf85d7fa991 # v1.6.4
        with:
          CONFIG_FILENAME: workflow-settings.json, workflow-details.json
          IGNORE_WARNING: 'true'
      - uses: technote-space/release-type-action@bb02685063c9ad7aad2b5de3fce80636f390bfd8 # v1.6.3
        with:
          EXCLUDE_MESSAGES: ${{ env.EXCLUDE_MESSAGES }}
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

  checkVersion:
    name: Check package version
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    if: "github.event.action == 'synchronize' && github.event.pull_request.head.user.id == github.event.pull_request.base.user.id && startsWith(github.head_ref, 'release/')"
    steps:
      - uses: technote-space/load-config-action@dbd17f7e0b2b95e36eb25d01e416baf85d7fa991 # v1.6.4
        with:
          CONFIG_FILENAME: workflow-settings.json, workflow-details.json
          IGNORE_WARNING: 'true'
      - name: Set running flag
        run: echo "RUNNING=1" >> $GITHUB_ENV
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set running flag
        run: |
          if [[ ! -f package.json ]] || [[ $(< package.json jq -r '.version == null') == 'true' ]]; then
            echo "RUNNING=" >> $GITHUB_ENV
          fi

      - name: Sort
        run: npx sort-package-json
        if: env.RUNNING
      - name: Get version
        uses: technote-space/get-next-version-action@c10e4576963c64873605960a3fd129fde634a889 # v1.4.3
        with:
          EXCLUDE_MESSAGES: ${{ env.EXCLUDE_MESSAGES }}
        if: "env.RUNNING && ! startsWith(github.head_ref, 'release/v')"
      - name: Get version
        run: echo "NEXT_VERSION=${HEAD_REF#release/}" >> $GITHUB_ENV
        env:
          HEAD_REF: ${{ github.head_ref }}
        if: env.RUNNING && startsWith(github.head_ref, 'release/v')
      - name: Check package version
        uses: technote-space/package-version-check-action@5b8670322cb31a68e5252c2dc7bc0016f7701ce6 # v1.9.3
        with:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          BRANCH_PREFIX: release/
          NEXT_VERSION: ${{ env.NEXT_VERSION }}
        if: env.NEXT_VERSION

  checkPublish:
    name: Check publish
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    if: "github.event.pull_request.head.user.id == github.event.pull_request.base.user.id && startsWith(github.head_ref, 'release/')"
    steps:
      - name: Set running flag
        run: echo "RUNNING=1" >> $GITHUB_ENV
      - name: Set running flag
        run: |
          if [ -z "$NPM_AUTH_TOKEN" ]; then
            echo "RUNNING=" >> $GITHUB_ENV
          fi
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: env.RUNNING
        with:
          persist-credentials: false
      - uses: technote-space/can-npm-publish-action@ee4e987bf21c2bade588f0b8c0953044bcb90090 # v1.3.6
        if: env.RUNNING
